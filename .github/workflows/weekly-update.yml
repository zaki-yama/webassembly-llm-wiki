name: weekly-update

on:
  schedule:
    - cron: "0 12 * * SUN" # 日曜 21:00 JST
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # デプロイワークフローのdispatch用
    steps:
      - uses: actions/checkout@v4

      - name: Run weekly update
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Claude GitHub App未インストールのため、ワークフローのトークンで動かす
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Proプランのサブスクリプション枠で実行(claude setup-token で発行)
          # APIクレジット課金(WIF)に切り替える場合は anthropic_federation_rule_id 等に置き換える
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            .claude/skills/weekly-update/SKILL.md の手順に従って週次更新を実行してください。
            ただしCI環境のため以下に注意:
            - 手順5(Artifact公開)はスキップし、log.md にその旨を書く
            - git commit / push は行わない(後続のワークフローステップが行う)
            - 対象週のニュースレター(wiki/newsletter/YYYY-Wnn.md)が既に存在する場合は、
              既存の内容を保持したまま新しい差分を追記・更新する(上書きで内容を消さない)
            - ファイルの変更(wikiページ反映・ニュースレター生成・watch-state.json / index.md / log.md の更新)まで完了させること
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "weekly: $(date +%G-W%V)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKENによるpushはpushトリガーのワークフローを起動しない(再帰防止)ため、
      # サイトのデプロイを明示的にdispatchする
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main
