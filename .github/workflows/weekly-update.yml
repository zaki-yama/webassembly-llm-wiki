name: weekly-update

on:
  schedule:
    - cron: "0 0 * * MON" # 月曜 09:00 JST
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Workload Identity Federation: GitHub OIDCトークンの取得に必要
    steps:
      - uses: actions/checkout@v4

      - name: Run weekly update
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Claude GitHub App未インストールのため、ワークフローのトークンで動かす
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 認証はWorkload Identity Federation(静的APIキー不要)
          # これらは識別子であり秘密情報ではないため直書きでよい
          anthropic_federation_rule_id: fdrl_01CNyBhQFrN8xzLGG9k7KCqr
          anthropic_organization_id: d0fb46e6-9c44-4cfc-b510-6c888e8d695e
          anthropic_service_account_id: svac_01QERgv32JaEGixXB523pMFZ
          anthropic_workspace_id: wrkspc_01GoYnMygFueGyeRet3XVfkw
          prompt: |
            .claude/skills/weekly-update/SKILL.md の手順に従って週次更新を実行してください。
            ただしCI環境のため以下に注意:
            - 手順5(Artifact公開)はスキップし、log.md にその旨を書く
            - git commit / push は行わない(後続のワークフローステップが行う)
            - 対象週のニュースレター(wiki/newsletter/YYYY-Wnn.md)が既に存在する場合は、
              既存の内容を保持したまま新しい差分を追記・更新する(上書きで内容を消さない)
            - ファイルの変更(wikiページ反映・ニュースレター生成・watch-state.json / index.md / log.md の更新)まで完了させること
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "weekly: $(date +%G-W%V)"
            git push
          fi
