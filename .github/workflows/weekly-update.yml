name: weekly-update

on:
  schedule:
    - cron: "0 0 * * MON" # 月曜 09:00 JST
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run weekly update
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            .claude/skills/weekly-update/SKILL.md の手順に従って週次更新を実行してください。
            ただしCI環境のため以下に注意:
            - 手順5(Artifact公開)はスキップし、log.md にその旨を書く
            - git commit / push は行わない(後続のワークフローステップが行う)
            - ファイルの変更(wikiページ反映・ニュースレター生成・watch-state.json / index.md / log.md の更新)まで完了させること
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "weekly: $(date +%G-W%V)"
            git push
          fi
